<!doctype html>
<meta charset="utf-8">
<title>Private embed — zero build</title>

<!--
  The entire dependency. No package manager, no bundler, no build step.
  This UMD bundle is not mentioned in the SDK README; it exists on the CDN
  and exposes a global.
-->
<script src="https://unpkg.com/@looker/embed-sdk@2.0.10/dist/main.js"></script>

<style>
  html, body { height: 100%; margin: 0; }
  #frame { height: 100dvh; width: 100vw; }
  #frame > iframe { width: 100%; height: 100%; border: 0; display: block; }
</style>

<div id="frame"></div>

<script>
  // The demo shell hands these in on the query string so you can retarget the
  // page without editing it. Copying this file? Delete these three lines and
  // hardcode your own two values instead.
  const params = new URLSearchParams(location.search);

  // Bare host, no scheme, no path — passing a full URL here produces a
  // double-encoded postMessage target origin.
  const LOOKER_HOST  = params.get('host')      || 'YOUR-INSTANCE.cloud.looker.com';
  const DASHBOARD_ID = params.get('dashboard') || 1;

  // NOTE: getEmbedSDK is the v2 factory.
  // window.LookerEmbedSDK.LookerEmbedSDK is the DEPRECATED v1 class.
  // The two names differ by one property access and nothing warns you.
  const { getEmbedSDK } = window.LookerEmbedSDK;

  getEmbedSDK().init(LOOKER_HOST);

  getEmbedSDK()
    .createDashboardWithId(DASHBOARD_ID)
    .appendTo(document.getElementById('frame'))
    .build()
    .connect()
    .catch(console.error);
</script>
